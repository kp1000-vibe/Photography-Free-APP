name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test -w web
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:web

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo-doctor
      - name: Bundle JS for both platforms
        run: npx expo export --platform android --platform ios --output-dir /tmp/lumen-export
